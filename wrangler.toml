name = "leelectrical-cf"
pages_build_output_dir = "."
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
STORAGE_BACKEND = "cloudflare"
# Staff ACH Process (LE Pro Mark-as-paid). Customer pay-page ACH uses SOLA_ACH_CUSTOMER_ENABLED secret.
SOLA_ACH_ENABLED = "true"

[[kv_namespaces]]
binding = "LE_KV"
id = "81063e3fc8504dd998a644add2ac9935"

[[r2_buckets]]
binding = "LE_R2"
bucket_name = "leoffice-r2"

# Agent Access — strongly-consistent state (Durable Object in le-agent-access-do).
# Deploy the DO worker first: cd workers/agent-access-do && npx wrangler deploy
# Prefer direct DO binding; service binding is the reliable Pages→Worker path.
[[durable_objects.bindings]]
name = "AGENT_ACCESS"
class_name = "AgentAccessState"
script_name = "le-agent-access-do"

[[services]]
binding = "AGENT_ACCESS_SVC"
service = "le-agent-access-do"
